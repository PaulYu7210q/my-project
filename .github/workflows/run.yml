name: Run Service

on:
  workflow_dispatch:
  schedule:
    # 每小时运行一次（UTC）。GitHub 定时任务在高负载时可能延迟数分钟。
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: run-group
  cancel-in-progress: false

env:
  GROK_REPO: PaulYu7210q/grokcli-2api
  # 远端 grok2api（账号密码推送，run.py 内置 remote-push 使用）
  SUB_API_URL: ${{ secrets.SUB_API_URL }}
  SUB_ADMIN_USER: ${{ secrets.SUB_ADMIN_USER }}
  SUB_ADMIN_PASS: ${{ secrets.SUB_ADMIN_PASS }}
  YESCAPTCHA_API_KEY: ${{ secrets.YESCAPTCHA_API_KEY }}
  TEMPMAIL_API_KEY: ${{ secrets.TEMPMAIL_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: "Pre-flight: check remote grok2api backend"
        run: |
          set -Eeuo pipefail
          [ -n "${SUB_API_URL:-}" ] || { echo "[!] SUB_API_URL secret missing"; exit 1; }
          code=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "${SUB_API_URL}/admin/api/login" || true)
          case "$code" in
            200|400|401|405) echo "[*] remote grok2api reachable (HTTP $code)" ;;
            *) echo "[!] remote grok2api unreachable (HTTP $code)"; exit 1 ;;
          esac

      - name: Checkout grokcli-2api source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GROK_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: grokcli-2api
          fetch-depth: 1

      - name: Install and start Cloudflare WARP SOCKS5 proxy
        run: |
          set -Eeuo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt update -qq
          sudo apt install -y -qq cloudflare-warp
          sudo systemctl start warp-svc
          sleep 3
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for _ in $(seq 1 30); do
            ss -ltn | grep -q ':40000' && break
            sleep 1
          done
          ss -ltn | grep ':40000' || { echo "[!] WARP SOCKS5 port 40000 not listening"; warp-cli --accept-tos status || true; exit 1; }
          code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out "%{http_code}" \
            --socks5-hostname 127.0.0.1:40000 https://accounts.x.ai/)
          [ "$code" != "000" ] || { echo "[!] WARP SOCKS5 transport failed"; exit 1; }
          echo "[*] WARP SOCKS5 ready: 127.0.0.1:40000 (x.ai HTTP $code)"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('grokcli-2api/grok-build-auth/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Camoufox browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-v1
          restore-keys: |
            ${{ runner.os }}-camoufox-

      - name: Install Python registration runtime
        working-directory: grokcli-2api
        run: |
          set -Eeuo pipefail
          sudo apt install -y -qq xvfb python3 python3-pip python3-requests \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libgtk-3-0 libasound2t64 libxss1 libxrandr2 libxkbcommon0 \
            libpango-1.0-0 libxshmfence1 libxcomposite1 libxdamage1 libxfixes3 \
            libxext6 fonts-liberation fonts-noto-color-emoji
          python3 -m pip install -U pip
          python3 -m pip install -r grok-build-auth/requirements.txt
          # OAuth 阶段需要浏览器;注册主体走纯协议(无浏览器)。
          if [ "${{ steps.camoufox-cache.outputs.cache-hit }}" != "true" ]; then
            python3 -m camoufox fetch
          else
            echo "[*] camoufox restored from cache; skip fetch"
          fi
          python3 -c "from xconsole_client import XConsoleAuthClient; print('[*] registration client import OK')"
          # 本地打码服务（Camoufox 内嵌）：无 YESCAPTCHA_API_KEY 时 run.py 回落到这里
          pip install -r turnstile-solver/requirements.txt
          mkdir -p turnstile-solver/logs turnstile-solver/keys
          printf 'socks5://127.0.0.1:40000\n' > turnstile-solver/proxies.txt
          export TURNSTILE_THREAD=1 TURNSTILE_LAZY=0 TURNSTILE_IDLE_SEC=0
          nohup python3 turnstile-solver/api_solver.py > turnstile-solver/logs/turnstile_solver.log 2>&1 &
          echo $! > /tmp/turnstile.pid
          for _ in $(seq 1 60); do
            curl -fsS -m 2 http://127.0.0.1:5072/health >/dev/null && { echo "[*] local turnstile solver ready"; break; }
            sleep 2
          done
          curl -fsS -m 2 http://127.0.0.1:5072/health >/dev/null || { echo "[!] local turnstile solver not ready"; tail -50 turnstile-solver/logs/turnstile_solver.log; exit 1; }

      - name: Register accounts (tempmail/qxfy random, local captcha, push to remote grok2api)
        working-directory: grokcli-2api
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD:$PWD/grok-build-auth"
          export DISPLAY=:99
          # 走 WARP 访问 x.ai
          export HTTPS_PROXY=socks5h://127.0.0.1:40000
          export HTTP_PROXY=socks5h://127.0.0.1:40000
          # 本地打码（无 API 打码 key；run.py 见 LOCAL_SOLVER_URL 即回落）
          export LOCAL_SOLVER_URL=http://127.0.0.1:5072
          Xvfb :99 -screen 0 1280x720x24 > xvfb.log 2>&1 &
          mkdir -p grok-build-auth/sso_output
          # 400 账号 / 并发 8 ≈ 数小时;GitHub job 上限 6h,内部计数自停。
          # --email auto = 每账号随机 tempmail / deploytools(qxfy)；成功即 POST 远端 import-sso，本地不落库。
          timeout 19000 python3 grok-build-auth/run.py \
            --count 400 \
            --threads 8 \
            --email auto \
            --no-oauth || true
          echo "[*] sso_output files: $(find grok-build-auth/sso_output -name 'sso_*.json' 2>/dev/null | wc -l)"

      - name: Final diagnostics
        if: always()
        run: |
          set -u
          redact() {
            sed -E \
              -e 's#("password"[[:space:]]*:[[:space:]]*")[^"]*"#\1***"#g' \
              -e 's#(token|authorization|cookie|sso)[=: ]+[^[:space:]]+#\1=***#Ig' \
              || true
          }
          echo "=== remote push status ==="
          curl -sS --max-time 15 -u "${SUB_ADMIN_USER}:${SUB_ADMIN_PASS}" \
            "${SUB_API_URL}/admin/api/accounts" 2>/dev/null | head -c 400 || echo "[!] cannot query remote accounts"
          echo
          echo "=== sso_output sample (redacted) ==="
          ls -la grokcli-2api/grok-build-auth/sso_output 2>/dev/null | tail -5 || true
